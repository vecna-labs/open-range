[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
license = "MIT"

[project]
name = "openrange"
version = "0.1.0"
description = "Domain-agnostic admitted world builder for agent training environments."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0.3",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
strands = [
    "strands-agents>=1.38.0",
    "strands-agents-tools>=0.4.1",
]

[project.scripts]
openrange = "openrange.__main__:main"

# Built-in packs live in their own workspace members under packs/ — they
# register themselves via openrange.packs / openrange.npcs entry points
# in their own pyproject.toml. Core has none.

[dependency-groups]
dev = [
    "coverage[toml]>=7.13",
    "mypy>=1.19",
    "pytest>=9.0",
    "ruff>=0.15.6",
]

[tool.uv.workspace]
members = []

[tool.hatch.build.targets.wheel]
packages = ["src/openrange"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["openrange"]
omit = [
    # manifest.py is the runtime-layer manifest parser. It's intact but
    # not wired to the new admission loop yet — the runtime side
    # (episode service, dashboard) was removed during this refactor and
    # will be re-built against the new shape; manifest.py comes back into
    # the coverage set when that happens.
    "src/openrange/core/manifest.py",
]

[tool.coverage.report]
# Will climb back toward 100 as the runtime side gets re-wired against
# the new pack/admission/distill shape.
fail_under = 85
show_missing = true
skip_covered = true
