[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openrange-webapp"
version = "0.1.0"
description = "Webapp pack for OpenRange — one world-family, two task families (build + pentest)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "openrange",
]

[project.entry-points."openrange.packs"]
"webapp" = "webapp:WebappPack"

[tool.hatch.build.targets.wheel]
packages = ["webapp"]
